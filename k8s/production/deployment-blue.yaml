apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntaxis-ocr-blue
  namespace: production
  labels:
    app: syntaxis-ocr
    environment: production
    version: blue
    deployment-strategy: blue-green
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: syntaxis-ocr
      environment: production
      version: blue
  template:
    metadata:
      labels:
        app: syntaxis-ocr
        environment: production
        version: blue
        deployment-strategy: blue-green
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        deployment.kubernetes.io/revision: "1"
    spec:
      serviceAccountName: syntaxis-ocr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: syntaxis-ocr
        image: ${DOCKER_REGISTRY}/syntaxis-ocr:production-current
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: METRICS_PORT
          value: "9090"
        - name: DEPLOYMENT_VERSION
          value: "blue"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: redis-url
        - name: GOOGLE_VISION_API_KEY
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: google-vision-api-key
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: aws-secret-access-key
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: sentry-dsn
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: log-level
        - name: MAX_FILE_SIZE
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: max-file-size
        - name: RATE_LIMIT_WINDOW
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: rate-limit-window
        - name: RATE_LIMIT_MAX_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: rate-limit-max-requests
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            ephemeral-storage: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health/startup
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: uploads-volume
          mountPath: /app/uploads
        - name: logs-volume
          mountPath: /app/logs
        - name: cache-volume
          mountPath: /app/cache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 1Gi
      - name: uploads-volume
        emptyDir:
          sizeLimit: 20Gi
      - name: logs-volume
        emptyDir:
          sizeLimit: 2Gi
      - name: cache-volume
        emptyDir:
          sizeLimit: 5Gi
      nodeSelector:
        kubernetes.io/arch: amd64
        node-type: production
      tolerations:
      - key: "production"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "high-memory"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - syntaxis-ocr
              - key: version
                operator: In
                values:
                - blue
            topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - production
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: instance-type
                operator: In
                values:
                - c5.2xlarge
                - c5.4xlarge
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: syntaxis-ocr-blue-service
  namespace: production
  labels:
    app: syntaxis-ocr
    environment: production
    version: blue
    deployment-strategy: blue-green
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "3"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: syntaxis-ocr
    environment: production
    version: blue
  sessionAffinity: None
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: syntaxis-ocr-blue-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: syntaxis-ocr
      environment: production
      version: blue
