apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntaxis-ocr
  namespace: staging
  labels:
    app: syntaxis-ocr
    environment: staging
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: syntaxis-ocr
      environment: staging
  template:
    metadata:
      labels:
        app: syntaxis-ocr
        environment: staging
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: syntaxis-ocr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: syntaxis-ocr
        image: ${DOCKER_REGISTRY}/syntaxis-ocr:staging-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "staging"
        - name: PORT
          value: "3000"
        - name: METRICS_PORT
          value: "9090"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: redis-url
        - name: GOOGLE_VISION_API_KEY
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: google-vision-api-key
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: aws-secret-access-key
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: syntaxis-ocr-secrets
              key: sentry-dsn
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: log-level
        - name: MAX_FILE_SIZE
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: max-file-size
        - name: RATE_LIMIT_WINDOW
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: rate-limit-window
        - name: RATE_LIMIT_MAX_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: syntaxis-ocr-config
              key: rate-limit-max-requests
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: uploads-volume
          mountPath: /app/uploads
        - name: logs-volume
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: uploads-volume
        emptyDir:
          sizeLimit: 10Gi
      - name: logs-volume
        emptyDir:
          sizeLimit: 1Gi
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "staging"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - syntaxis-ocr
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syntaxis-ocr
  namespace: staging
  labels:
    app: syntaxis-ocr
    environment: staging
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: syntaxis-ocr-pdb
  namespace: staging
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: syntaxis-ocr
      environment: staging
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: syntaxis-ocr-hpa
  namespace: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: syntaxis-ocr
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
