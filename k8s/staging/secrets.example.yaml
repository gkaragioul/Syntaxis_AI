# Example only. Copy to k8s/staging/secrets.yaml (git-ignored), replace every
# REPLACE_ME value with a real secret, and never commit the filled-in file.
# Better still, create the secret from a secret manager or with
#   kubectl create secret generic syntaxis-ocr-secrets --from-literal=...
#
# Keys below are the ones referenced by k8s/staging/deployment.yaml and
# k8s/production/deployment-*.yaml (secretKeyRef name: syntaxis-ocr-secrets).
apiVersion: v1
kind: Secret
metadata:
  name: syntaxis-ocr-secrets
  namespace: staging
  labels:
    app: syntaxis-ocr
    environment: staging
type: Opaque
stringData:
  database-url: "postgresql://REPLACE_ME_USER:REPLACE_ME_PASSWORD@REPLACE_ME_HOST:5432/REPLACE_ME_DB"
  redis-url: "redis://REPLACE_ME_HOST:6379"
  google-vision-api-key: "REPLACE_ME"
  aws-access-key-id: "REPLACE_ME"
  aws-secret-access-key: "REPLACE_ME"
  sentry-dsn: "REPLACE_ME"
